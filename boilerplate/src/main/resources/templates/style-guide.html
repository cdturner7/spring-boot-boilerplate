<!doctype html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="www.ultraq.net.nz"
      layout:decorate="~{layouts/main-layout}">
    
    <head>
        <title>Style Guide</title>
    </head>

    <body>
        <div layout:fragment="content">
            
            <th:block th:replace="~{fragments/heading :: h1(#{style.guide})}"></th:block>

            <div class="mt-3 grid grid-cols-3 gap-5 items-start content-start grid-flow-col-dense md:grid-flow-row">
                <!-- Heading Samples -->
                <div class="p-4 rounded-2xl shadow">
                    <th:block th:replace="~{fragments/heading :: h3('Heading Samples')}"></th:block>
                    <div class="mt-4 flex flex-col">
                        <th:block th:replace="~{fragments/heading :: h1('Heading 1')}"></th:block>
                        <th:block th:replace="~{fragments/heading :: h2('Heading 2')}"></th:block>
                        <th:block th:replace="~{fragments/heading :: h3('Heading 3')}"></th:block>
                        <th:block th:replace="~{fragments/heading :: h4('Heading 4')}"></th:block>
                        <th:block th:replace="~{fragments/heading :: h5('Heading 5')}"></th:block>
                        <th:block th:replace="~{fragments/heading :: h6('Heading 6')}"></th:block>
                    </div>
                </div>

                <!-- Button Samples -->
                <div class="p-4 rounded-2xl shadow">
                    <th:block th:replace="~{fragments/heading :: h3('Button Samples')}"></th:block>
                    <div class="mt-4 flex gap-5">
                        <th:block th:replace="~{fragments/button :: primary('Primary', '#')}"></th:block>
                        <th:block th:replace="~{fragments/button :: secondary('Secondary', '#')}"></th:block>
                        <th:block th:replace="~{fragments/button :: link('link', '#')}"></th:block>
                    </div>
                </div>

                <div class="p-4 flex flex-col items-center justify-center rounded-2xl shadow">
                    <!-- Button Example -->
                    <button class="neumorph-btn bg-[#f2f6fc] text-gray-700 font-semibold px-8 py-4 rounded-2xl transition-all duration-200">
                        Click Me
                    </button>

                    <div class="mt-12"></div>

                    <!-- Card Example -->
                    <div class="neumorph-card bg-[#f2f6fc] p-8 rounded-3xl max-w-sm">
                        <h2 class="text-2xl font-bold text-gray-800 mb-4">Neumorphic Card</h2>
                        <p class="text-gray-600 mb-6">This card demonstrates the soft, extruded appearance of neumorphism with dual shadows creating depth.</p>
                        <button class="neumorph-btn bg-[#f2f6fc] text-gray-700 font-medium px-6 py-3 rounded-xl transition-all duration-200 w-full">
                            Action
                        </button>
                    </div>
                </div>

                <!-- Form Element Sample -->
                <div class="row-span-2 flex flex-col gap-4 p-4 rounded-2xl shadow">
                    <th:block th:replace="~{fragments/heading :: h3('Form Element Samples')}"></th:block>
                    <form>
                        <th:block th:replace="~{fragments/heading :: h3('Text Inputs')}"></th:block>
                        <label class="block text-sm font-medium text-gray-700">
                            Text Input:
                            <input type="text" name="text" placeholder="Enter text" />
                        </label>
                        <br />
                        <label>
                            Password:
                            <input type="password" name="password" placeholder="Enter password" />
                        </label>
                        <br />
                        <label>
                            Email:
                            <input type="email" name="email" placeholder="example@mail.com" />
                        </label>
                        <br />
                        <label>
                            Number:
                            <input type="number" name="number" placeholder="123" />
                        </label>
                        <br />
                        <label>
                            Search:
                            <input type="search" name="search" placeholder="Search..." />
                        </label>
                        <br />
                        <label>
                            Telephone:
                            <input type="tel" name="tel" placeholder="(123) 456-7890" />
                        </label>
                        <br />
                        <label>
                            URL:
                            <input type="url" name="url" placeholder="https://example.com" />
                        </label>
                        <br />
                        <label>
                            Date:
                            <input type="date" name="date" />
                        </label>
                        <br />
                        <label>
                            Time:
                            <input type="time" name="time" />
                        </label>
                        <br />
                        <label>
                            Datetime-local:
                            <input type="datetime-local" name="datetime" />
                        </label>
                        <br />
                        <label>
                            Month:
                            <input type="month" name="month" />
                        </label>
                        <br />
                        <label>
                            Week:
                            <input type="week" name="week" />
                        </label>

                        <th:block th:replace="~{fragments/heading :: h3('Dropdowns and Selects')}"></th:block>
                        <label>
                            Single Select:
                            <select name="single">
                                <option value="">Select one</option>
                                <option value="1">Option 1</option>
                                <option value="2">Option 2</option>
                            </select>
                        </label>
                        <br />
                        <label>
                            Multi Select:
                            <select name="multi" multiple>
                                <option value="1">Option A</option>
                                <option value="2">Option B</option>
                                <option value="3">Option C</option>
                            </select>
                        </label>

                        <th:block th:replace="~{fragments/heading :: h3('Checkboxes and Radios')}"></th:block>
                        <fieldset>
                            <legend>Checkboxes</legend>
                            <label><input type="checkbox" name="check1" /> Option 1</label>
                            <label><input type="checkbox" name="check2" /> Option 2</label>
                            <label><input type="checkbox" name="check3" /> Option 3</label>
                        </fieldset>
                        <fieldset>
                            <legend>Radio Buttons</legend>
                            <label><input type="radio" name="radio" value="1" /> Option 1</label>
                            <label><input type="radio" name="radio" value="2" /> Option 2</label>
                        </fieldset>

                        <th:block th:replace="~{fragments/heading :: h3('Range, Color, and File')}"></th:block>
                        <label>
                            Range:
                            <input type="range" name="range" min="0" max="100" />
                        </label>
                        <br />
                        <label>
                            Color Picker:
                            <input type="color" name="color" />
                        </label>
                        <br />
                        <label>
                            File Upload:
                            <input type="file" name="file" />
                        </label>

                        <th:block th:replace="~{fragments/heading :: h3('Textarea')}"></th:block>
                        <label>
                            Message:
                            <textarea name="message" rows="4" cols="40" placeholder="Write something..."></textarea>
                        </label>

                        <th:block th:replace="~{fragments/heading :: h3('Buttons')}"></th:block>
                        <button type="submit">Submit</button>
                        <button type="reset">Reset</button>
                        <button type="button" onclick="alert('Clicked!')">Click Me</button>
                    </form>
                </div>
            </div>

        </div>
    </body>
</html>
