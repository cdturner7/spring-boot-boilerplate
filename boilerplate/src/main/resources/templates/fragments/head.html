        <!-- google fonts -->
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&display=swap" rel="stylesheet">

        <!-- google icons -->
        <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
        <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />

        <!-- font awesome -->
        <script src="https://kit.fontawesome.com/66bf4086b5.js" crossorigin="anonymous"></script>

        <!-- gsap -->
        <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>

        <!-- prevent light theme flicker when page loads by setting value before it has a chance to flicker -->
        <script>
            // Apply theme immediately, before page renders
            (function() {
                const theme = localStorage.theme === 'dark' ||
                             (!localStorage.theme && window.matchMedia('(prefers-color-scheme: dark)').matches)
                             ? 'dark'
                             : 'light';

                if (theme === 'dark') {
                    document.documentElement.classList.add('dark');
                }
            })();
        </script>

        <!-- tailwind css -->
        <link rel="stylesheet" th:href="@{/css/style.css}"/>

        <!-- favorite icon -->
        <link rel="icon" th:href="@{/images/ide.png}"/>

        <!-- main scripts for site -->
        <script th:src="@{/scripts/base.js}" type="text/javascript"></script>
        <script th:src="@{/scripts/thememanager.js}" type="text/javascript"></script>
    </th:block>
