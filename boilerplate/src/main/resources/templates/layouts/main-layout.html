 <!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="www.ultraq.net.nz"
      class="bg-light-theme dark:bg-dark-theme scroll-smooth">

    <!-- insert head -->
    <head>
        <th:block th:replace="~{fragments/head :: head}"/>
        <!-- Each token will be replaced by their respective titles in the resulting page. -->
        <title layout:title-pattern="$LAYOUT_TITLE - $CONTENT_TITLE">Boilerplate</title>
    </head>

    <!-- start of body -->
    <body class="flex flex-col bg-neu-light-100 dark:bg-neu-dark-100">
        <!-- insert header -->
        <th:block th:replace="~{fragments/header :: header}"></th:block>
        
        <!-- start main content -->
        <th:block layout:fragment="content" class="container mx-auto flex-1 p-6 my-6"></th:block>
        <!-- end main content -->

        <!-- insert footer -->
        <th:block th:replace="~{fragments/footer :: footer}"></th:block>
    </body>
    <!-- end body -->
    
</html>
